<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #status {
    position: fixed; top: 12px; left: 12px;
    color: #fff; font: 14px system-ui;
    background: rgba(0,0,0,0.5); padding: 8px 12px;
    border-radius: 8px; z-index: 10;
    max-width: 80vw;
  }
  #zoomInfo {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font: 14px system-ui;
    background: rgba(0,0,0,0.5); padding: 6px 12px;
    border-radius: 8px; z-index: 10;
  }
</style>
</head>
<body>
<video id="preview" autoplay muted playsinline></video>
<div id="status">Инициализация…</div>
<div id="zoomInfo"></div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
// ============ НАСТРОЙКИ ============
// ВАЖНО: замени ID на свой уникальный — иначе кто угодно сможет подключиться
const ROOM_ID = 'cam-7f3a9b2c-my-camera';

const BASE_VIDEO_CONSTRAINTS = {
  video: {
    facingMode: 'environment',   // задняя камера
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  },
  audio: false
};
// ===================================

const preview   = document.getElementById('preview');
const statusEl  = document.getElementById('status');
const zoomInfo  = document.getElementById('zoomInfo');

let stream = null;
let track = null;
let peer = null;
let controllerConn = null;   // DataConnection от пульта
let activeCall = null;       // MediaConnection с пультом
let zoomCapabilities = null; // { min, max, step } или null
let usingFrontCamera = false;

function setStatus(text) {
  statusEl.textContent = text;
  console.log('[status]', text);
}

// ---------- 1. Запуск камеры ----------
async function startCamera(constraints = BASE_VIDEO_CONSTRAINTS) {
  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia(constraints);
  track = stream.getVideoTracks()[0];
  preview.srcObject = stream;

  const caps = track.getCapabilities ? track.getCapabilities() : {};
  zoomCapabilities = caps.zoom || null;

  if (zoomCapabilities) {
    zoomInfo.textContent = `Зум: ${zoomCapabilities.min}–${zoomCapabilities.max}`;
  } else {
    zoomInfo.textContent = 'Зум не поддерживается (iOS Safari / некоторые Android)';
  }

  console.log('Возможности камеры:', caps);
}

// ---------- 2. PeerJS: создаём комнату ----------
function startPeer() {
  peer = new Peer(ROOM_ID, { debug: 2 });

  peer.on('open', (id) => {
    setStatus('Ожидание пульта… ID: ' + id);
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    setStatus('Ошибка Peer: ' + err.type);
  });

  // Пульт подключается через DataConnection — обмен командами
  peer.on('connection', (conn) => {
    console.log('Пульт подключён (DataConnection)');
    controllerConn = conn;
    setStatus('Пульт подключён');

    conn.on('data', handleCommand);
    conn.on('close', () => {
      setStatus('Пульт отключился');
      controllerConn = null;
    });
    conn.on('error', (err) => console.error('Conn error:', err));
  });

  // Пульт звонит по WebRTC — забирает видеопоток
  peer.on('call', (call) => {
    console.log('Пульт запросил видео');
    activeCall = call;
    call.answer(stream);
    call.on('close', () => { activeCall = null; });
    call.on('error', (err) => console.error('Call error:', err));
  });
}

// ---------- 3. Обработка команд от пульта ----------
async function handleCommand(cmd) {
  console.log('Команда от пульта:', cmd);
  if (!cmd || typeof cmd !== 'object') return;

  switch (cmd.type) {

    case 'zoom': {
      if (!zoomCapabilities) {
        console.warn('Зум не поддерживается устройством');
        return;
      }
      const value = Math.max(
        zoomCapabilities.min,
        Math.min(zoomCapabilities.max, Number(cmd.value) || 1)
      );
      try {
        await track.applyConstraints({ advanced: [{ zoom: value }] });
        zoomInfo.textContent = `Зум: ${value.toFixed(2)}`;
      } catch (e) {
        console.error('Ошибка применения зума:', e);
      }
      break;
    }

    case 'switchCamera': {
      usingFrontCamera = !usingFrontCamera;
      const newConstraints = {
        video: {
          facingMode: usingFrontCamera ? 'user' : 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };
      try {
        await startCamera(newConstraints);

        // Подменяем видеодорожку в уже установленном звонке
        if (activeCall) {
          const sender = activeCall.peerConnection
            .getSenders()
            .find(s => s.track && s.track.kind === 'video');
          if (sender) await sender.replaceTrack(track);
        }
        if (controllerConn && controllerConn.open) {
          controllerConn.send({ type: 'cameraSwitched', front: usingFrontCamera });
        }
      } catch (e) {
        console.error('Ошибка переключения камеры:', e);
      }
      break;
    }

    case 'ping': {
      if (controllerConn && controllerConn.open) {
        controllerConn.send({ type: 'pong', t: Date.now() });
      }
      break;
    }

    default:
      console.warn('Неизвестная команда:', cmd);
  }
}

// ---------- 4. Старт ----------
(async function main() {
  try {
    setStatus('Запрос доступа к камере…');
    await startCamera();
    setStatus('Камера запущена');
    startPeer();
  } catch (e) {
    console.error(e);
    setStatus('Ошибка: ' + e.message);
  }
})();

// Останавливаем камеру при закрытии страницы
window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
});
</script>
</body>
</html>
