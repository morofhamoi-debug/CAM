<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HTML Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1e2e;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .top {
    padding: 12px 15px;
    background: #181825;
    border-bottom: 1px solid #313244;
  }

  button.show-btn {
    padding: 10px 22px;
    background: #89b4fa;
    color: #1e1e2e;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }

  button.show-btn:hover { background: #b4befe; }

  /* Область редактора */
  .editor {
    flex: 1;
    display: flex;
    overflow: hidden;
    background: #1e1e2e;
  }

  /* Номера строк */
  #lines {
    padding: 15px 10px 15px 15px;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    color: #6c7086;
    text-align: right;
    user-select: none;
    background: #181825;
    overflow: hidden;
    white-space: pre;
  }

  /* Сам редактор */
  #code {
    flex: 1;
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    background: #1e1e2e;
    color: #cdd6f4;
    border: none;
    outline: none;
    resize: none;
    white-space: pre;
    overflow-x: auto;   /* прокрутка по горизонтали */
    overflow-y: auto;   /* прокрутка по вертикали */
  }

  /* Полноэкранный просмотр */
  #full {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    z-index: 999;
  }

  #full iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Маленькая кнопка выхода */
  #exit {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 6px 14px;
    font-size: 12px;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    z-index: 1000;
    opacity: 0.35;
    transition: opacity 0.3s;
  }

  #exit:hover { opacity: 1; }
</style>
</head>
<body>

  <div class="top">
    <button class="show-btn" id="showBtn">▶ Показать</button>
  </div>

  <div class="editor">
    <div id="lines">1</div>
    <textarea id="code" spellcheck="false" wrap="off"></textarea>
  </div>

  <div id="full">
    <iframe id="preview"></iframe>
    <button id="exit">✕ Выйти</button>
  </div>

<script>
  const codeEl = document.getElementById('code');
  const linesEl = document.getElementById('lines');

  // Стартовый код
  const defaultCode = `<h1 style="color:#764ba2;font-family:sans-serif;text-align:center;margin-top:100px">
  Привет, мир!
</h1>
<p style="text-align:center;font-family:sans-serif">
  Замени этот код своим 👆
</p>`;

  codeEl.value = localStorage.getItem('mycode') || defaultCode;

  // Обновляем номера строк
  function updateLines() {
    const count = codeEl.value.split('\n').length;
    let out = '';
    for (let i = 1; i <= count; i++) out += i + '\n';
    linesEl.textContent = out;
  }

  // Синхронизация прокрутки номеров со строками
  codeEl.addEventListener('scroll', () => {
    linesEl.scrollTop = codeEl.scrollTop;
  });

  codeEl.addEventListener('input', () => {
    localStorage.setItem('mycode', codeEl.value);
    updateLines();
  });

  updateLines();

  // ==== Показ ====
  const preview = document.getElementById('preview');
  const full = document.getElementById('full');

  document.getElementById('showBtn').addEventListener('click', () => {
    // Blob-URL надёжнее, чем srcdoc — не ломается на кавычках
    const blob = new Blob([codeEl.value], { type: 'text/html' });
    preview.src = URL.createObjectURL(blob);
    full.style.display = 'block';
  });

  function close() {
    full.style.display = 'none';
    preview.src = 'about:blank';
  }

  document.getElementById('exit').addEventListener('click', close);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
  });
</script>

</body>
</html>
