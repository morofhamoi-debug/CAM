    </div>
    <div class="panel">
      <div class="panel-head"><h3>Последние заказы</h3><a href="#/admin/orders" class="btn btn-ghost btn-sm">Все заказы →</a></div>
      ${orders.length === 0
        ? `<div style="padding:48px 24px;text-align:center;color:var(--muted)">Заказы отсутствуют</div>`
        : `<div class="table-wrap"><table class="tbl">
            <thead><tr><th>ID</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead>
            <tbody>${orders.slice(0,5).map(o=>`
              <tr>
                <td class="muted" style="font-family:ui-monospace,monospace;font-size:12px">#${esc(o.id.slice(-8))}</td>
                <td>${esc(o.customer.name)}</td>
                <td>${fmt(o.total)}</td>
                <td><span class="status status-${o.status}">${statusLabel(o.status)}</span></td>
                <td class="muted">${dateRu(o.createdAt)}</td>
              </tr>`).join('')}</tbody>
          </table></div>`}
    </div>`;
}

/* ADMIN: products */
function adminProducts(content) {
  function render() {
    const products = Products.all();
    const cats = Categories.all();
    const catMap = Object.fromEntries(cats.map(c => [c.id, c.name]));
    content.innerHTML = `
      <div class="admin-header">
        <div><h1>Товары</h1><p>Управление каталогом</p></div>
        <button class="btn btn-primary" id="add-product">+ Добавить товар</button>
      </div>
      <div class="panel">
        ${products.length === 0
          ? `<div style="padding:60px 24px;text-align:center;color:var(--muted)">Товары отсутствуют</div>`
          : `<div class="table-wrap"><table class="tbl">
              <thead><tr><th></th><th>Название</th><th>Категория</th><th>Цена</th><th>Наличие</th><th>Статус</th><th></th></tr></thead>
              <tbody>${products.map(p => {
                const stock = p.variants.reduce((s,v)=>s+v.stock,0);
                return `<tr>
                  <td>${p.images && p.images[0] ? `<img class="tbl-img" src="${p.images[0]}" alt="">` : `<div class="tbl-img" style="display:grid;place-items:center;color:#ccc;font-size:9px">—</div>`}</td>
                  <td><b>${esc(p.name)}</b>${p.sku?`<div class="muted" style="font-size:12px">${esc(p.sku)}</div>`:''}</td>
                  <td class="muted">${p.categoryId && catMap[p.categoryId] ? esc(catMap[p.categoryId]) : '—'}</td>
                  <td>${fmt(p.price)}${p.oldPrice&&p.oldPrice>p.price?`<div class="muted" style="text-decoration:line-through;font-size:12px">${fmt(p.oldPrice)}</div>`:''}</td>
                  <td>${stock > 0 ? stock + ' шт.' : '<span class="muted">нет</span>'}</td>
                  <td>${p.isNew?'<span class="tag tag-new" style="font-size:10px">Новинка</span> ':''}${p.isSale?'<span class="tag tag-sale" style="font-size:10px">Sale</span>':''}</td>
                  <td><div class="tbl-actions">
                    <button class="icon-act" data-edit="${p.id}" title="Редактировать">${ICONS.edit}</button>
                    <button class="icon-act danger" data-del="${p.id}" title="Удалить">${ICONS.trash}</button>
                  </div></td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>`}
      </div>`;

    $('#add-product').onclick = () => openProductForm(null);
    content.onclick = async e => {
      const edit = e.target.closest('[data-edit]');
      if (edit) { openProductForm(Products.find(edit.dataset.edit)); return; }
      const del = e.target.closest('[data-del]');
      if (del) {
        const p = Products.find(del.dataset.del);
        if (!p) return;
        const ok = await confirmDialog('Удалить товар?', `«${p.name}» будет удалён безвозвратно.`);
        if (ok) { Products.remove(p.id); toast('Товар удалён'); render(); renderHeader(); }
      }
    };
  }

  function openProductForm(p) {
    const cats = Categories.all();
    const editing = !!p;
    p = p || { name:'', description:'', price:'', oldPrice:'', categoryId:'', sku:'', isNew:false, isSale:false, images:[], variants:[{size:'',color:'',stock:0}] };

    openModal({
      title: editing ? 'Редактировать товар' : 'Новый товар',
      wide: true,
      body: `
        <div class="field"><label>Название *</label><input class="input" id="pf-name" value="${esc(p.name)}"></div>
        <div class="field"><label>Описание</label><textarea class="input" id="pf-desc" rows="4">${esc(p.description)}</textarea></div>
        <div class="row2">
          <div class="field"><label>Цена, ₽ *</label><input class="input" type="number" min="0" step="0.01" id="pf-price" value="${p.price}"></div>
          <div class="field"><label>Старая цена, ₽</label><input class="input" type="number" min="0" step="0.01" id="pf-oldprice" value="${p.oldPrice||''}"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Категория</label>
            <select class="input" id="pf-cat">
              <option value="">— без категории —</option>
              ${cats.map(c=>`<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Артикул (SKU)</label><input class="input" id="pf-sku" value="${esc(p.sku||'')}"></div>
        </div>
        <div class="row2">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="pf-new" ${p.isNew?'checked':''}> Новинка</label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="pf-sale" ${p.isSale?'checked':''}> Распродажа</label>
        </div>
        <div class="divider"></div>
        <div class="field">
          <label>Варианты (размер · цвет · остаток)</label>
          <div id="pf-variants"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="pf-add-variant">+ Добавить вариант</button>
        </div>
        <div class="divider"></div>
        <div class="field">
          <label>Фотографии</label>
          <input type="file" id="pf-images" accept="image/*" multiple>
          <div id="pf-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
        </div>
      `,
      actions: [
        { label: 'Отмена', variant: 'btn-ghost' },
        { label: editing ? 'Сохранить' : 'Добавить', variant: 'btn-primary', onClick: async () => {
          const name = $('#pf-name').value.trim();
          const price = parseFloat($('#pf-price').value);
          const oldPrice = parseFloat($('#pf-oldprice').value) || null;
          if (!name) { toast('Укажите название', 'error'); return false; }
          if (!(price >= 0)) { toast('Укажите корректную цену', 'error'); return false; }
          const variants = $$('#pf-variants .v-row').map(row => ({
            size: row.querySelector('[data-v-size]').value.trim(),
            color: row.querySelector('[data-v-color]').value.trim(),
            stock: parseInt(row.querySelector('[data-v-stock]').value, 10) || 0
          })).filter(v => v.size || v.color);
          if (variants.length === 0) variants.push({ size:'', color:'', stock: 0 });

          const images = window.__pfImages || [];
          const data = {
            id: p.id,
            name,
            description: $('#pf-desc').value.trim(),
            price,
            oldPrice: oldPrice && oldPrice > price ? oldPrice : null,
            categoryId: $('#pf-cat').value || null,
            sku: $('#pf-sku').value.trim(),
            isNew: $('#pf-new').checked,
            isSale: $('#pf-sale').checked,
            variants,
            images
          };
          try {
            Products.save(data);
            toast(editing ? 'Изменения сохранены' : 'Товар добавлен');
            delete window.__pfImages;
            render(); renderHeader();
            return true;
          } catch(e) { toast(e.message, 'error'); return false; }
        }}
      ],
      onMount: (root, close) => {
        window.__pfImages = [...(p.images || [])];

        const vWrap = $('#pf-variants', root);
        function renderVariants() {
          vWrap.innerHTML = (p.variants && p.variants.length ? p.variants : [{size:'',color:'',stock:0}]).map((v,i) => `
            <div class="v-row" style="display:grid;grid-template-columns:1fr 1fr 100px 40px;gap:8px;margin-bottom:8px">
              <input class="input" data-v-size placeholder="Размер" value="${esc(v.size)}">
              <input class="input" data-v-color placeholder="Цвет" value="${esc(v.color)}">
              <input class="input" type="number" min="0" data-v-stock placeholder="0" value="${v.stock}">
              <button type="button" class="icon-act danger" data-rm>${ICONS.trash}</button>
            </div>`).join('');
          vWrap.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
            const rows = [...vWrap.querySelectorAll('.v-row')];
            const idx = rows.indexOf(b.closest('.v-row'));
            p.variants = [...vWrap.querySelectorAll('.v-row')].map(row => ({
              size: row.querySelector('[data-v-size]').value,
              color: row.querySelector('[data-v-color]').value,
              stock: +row.querySelector('[data-v-stock]').value || 0
            }));
            p.variants.splice(idx,1);
            if (p.variants.length===0) p.variants.push({size:'',color:'',stock:0});
            renderVariants();
          });
        }
        // Считываем при кликах
        vWrap.addEventListener('input', () => {
          p.variants = [...vWrap.querySelectorAll('.v-row')].map(row => ({
            size: row.querySelector('[data-v-size]').value,
            color: row.querySelector('[data-v-color]').value,
            stock: +row.querySelector('[data-v-stock]').value || 0
          }));
        });
        renderVariants();

        $('#pf-add-variant', root).onclick = () => {
          p.variants = [...vWrap.querySelectorAll('.v-row')].map(row => ({
            size: row.querySelector('[data-v-size]').value,
            color: row.querySelector('[data-v-color]').value,
            stock: +row.querySelector('[data-v-stock]').value || 0
          }));
          p.variants.push({size:'',color:'',stock:0});
          renderVariants();
        };

        // images
        function renderPreview() {
          const wrap = $('#pf-preview', root);
          wrap.innerHTML = window.__pfImages.map((src,i)=>`
            <div style="position:relative">
              <img src="${src}" style="width:72px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">
              <button type="button" class="icon-act danger" data-rm-img="${i}" style="position:absolute;top:-4px;right:-4px;background:#fff;border:1px solid var(--border);width:22px;height:22px;font-size:14px">×</button>
            </div>`).join('');
          wrap.querySelectorAll('[data-rm-img]').forEach(b => b.onclick = () => {
            window.__pfImages.splice(+b.dataset.rmImg, 1); renderPreview();
          });
        }
        renderPreview();

        $('#pf-images', root).onchange = async e => {
          const files = [...e.target.files];
          for (const f of files) {
            try {
              const dataUrl = await resizeImage(f, 900, 0.82);
              window.__pfImages.push(dataUrl);
            } catch { toast('Не удалось обработать файл', 'error'); }
          }
          e.target.value = '';
          renderPreview();
        };
      }
    });
  }

  render();
}

/* ADMIN: orders */
function adminOrders(content) {
  function render() {
    const orders = Orders.all();
    content.innerHTML = `
      <div class="admin-header">
        <div><h1>Заказы</h1><p>Управление заказами магазина</p></div>
      </div>
      <div class="panel">
        ${orders.length === 0
          ? `<div style="padding:60px 24px;text-align:center;color:var(--muted)">Заказы отсутствуют</div>`
          : `<div class="table-wrap"><table class="tbl">
              <thead><tr><th>ID</th><th>Покупатель</th><th>Товары</th><th>Сумма</th><th>Дата</th><th>Статус</th></tr></thead>
              <tbody>${orders.map(o => `
                <tr>
                  <td class="muted" style="font-family:ui-monospace,monospace;font-size:12px">#${esc(o.id.slice(-8))}</td>
                  <td>
                    <div>${esc(o.customer.name)}</div>
                    <div class="muted" style="font-size:12px">${esc(o.customer.email)}</div>
                    ${o.customer.phone?`<div class="muted" style="font-size:12px">${esc(o.customer.phone)}</div>`:''}
                  </td>
                  <td class="muted" style="font-size:12.5px">${o.items.map(it=>esc(it.productName)+' ×'+it.quantity).join(', ')}</td>
                  <td><b>${fmt(o.total)}</b></td>
                  <td class="muted" style="font-size:12.5px">${dateRu(o.createdAt)}</td>
                  <td>
                    <select class="status-select" data-oid="${o.id}">
                      ${ORDER_STATUSES.map(s=>`<option value="${s.key}" ${o.status===s.key?'selected':''}>${s.label}</option>`).join('')}
                    </select>
                  </td>
                </tr>`).join('')}
              </tbody></table></div>`}
      </div>`;
    $$('select[data-oid]').forEach(sel => sel.onchange = () => {
      try { Orders.updateStatus(sel.dataset.oid, sel.value); toast('Статус заказа изменён'); }
      catch(e) { toast(e.message, 'error'); render(); }
    });
  }
  render();
}

/* ADMIN: users */
function adminUsers(content) {
  const me = Auth.current();
  function render() {
    const users = Users.all();
    const orders = Orders.all();
    content.innerHTML = `
      <div class="admin-header">
        <div><h1>Пользователи</h1><p>Все зарегистрированные аккаунты</p></div>
      </div>
      <div class="panel">
        ${users.length === 0
          ? `<div style="padding:60px 24px;text-align:center;color:var(--muted)">Пользователи отсутствуют</div>`
          : `<div class="table-wrap"><table class="tbl">
              <thead><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Заказов</th><th>Регистрация</th><th></th></tr></thead>
              <tbody>${users.map(u => {
                const count = orders.filter(o=>o.userId===u.id).length;
                const isMe = u.id === me.id;
                return `<tr>
                  <td><b>${esc(u.name)}</b>${isMe?' <span class="muted" style="font-size:11px">(вы)</span>':''}</td>
                  <td class="muted">${esc(u.email)}</td>
                  <td>${u.role==='admin'?'<span class="tag tag-new">admin</span>':'<span class="muted">user</span>'}</td>
                  <td>${count}</td>
                  <td class="muted">${dateRu(u.createdAt)}</td>
                  <td><div class="tbl-actions">
                    ${u.role==='admin'
                      ? `<button class="btn btn-ghost btn-sm" data-role="${u.id}" data-to="user">Снять админа</button>`
                      : `<button class="btn btn-ghost btn-sm" data-role="${u.id}" data-to="admin">Сделать админом</button>`}
                    ${isMe?'':`<button class="icon-act danger" data-del="${u.id}" title="Удалить">${ICONS.trash}</button>`}
                  </div></td>
                </tr>`;
              }).join('')}</tbody></table></div>`}
      </div>`;

    content.onclick = async e => {
      const role = e.target.closest('[data-role]');
      if (role) {
        try { Users.update(role.dataset.role, { role: role.dataset.to }); toast('Роль обновлена'); render(); }
        catch(err) { toast(err.message, 'error'); }
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        const u = Users.find(del.dataset.del);
        const ok = await confirmDialog('Удалить пользователя?', `${u ? u.name : ''} будет удалён безвозвратно.`);
        if (ok) {
          try { Users.remove(del.dataset.del, me.id); toast('Пользователь удалён'); render(); }
          catch(err) { toast(err.message, 'error'); }
        }
      }
    };
  }
  render();
}

/* ADMIN: categories */
function adminCategories(content) {
  function render() {
    const cats = Categories.all();
    const products = Products.all();
    content.innerHTML = `
      <div class="admin-header">
        <div><h1>Категории</h1><p>Разделы каталога</p></div>
        <button class="btn btn-primary" id="add-cat">+ Новая категория</button>
      </div>
      <div class="panel">
        ${cats.length === 0
          ? `<div style="padding:60px 24px;text-align:center;color:var(--muted)">Категорий пока нет. Создайте первую.</div>`
          : `<div class="table-wrap"><table class="tbl">
              <thead><tr><th>Название</th><th>Товаров</th><th>Создана</th><th></th></tr></thead>
              <tbody>${cats.map(c => {
                const count = products.filter(p => p.categoryId === c.id).length;
                return `<tr>
                  <td><b>${esc(c.name)}</b></td>
                  <td>${count}</td>
                  <td class="muted">${dateRu(c.createdAt)}</td>
                  <td><div class="tbl-actions">
                    <button class="icon-act" data-ren="${c.id}" title="Переименовать">${ICONS.edit}</button>
                    <button class="icon-act danger" data-del="${c.id}" title="Удалить">${ICONS.trash}</button>
                  </div></td>
                </tr>`;
              }).join('')}</tbody></table></div>`}
      </div>`;

    $('#add-cat').onclick = () => {
      openModal({
        title: 'Новая категория',
        body: `<div class="field"><label>Название</label><input class="input" id="cat-name" placeholder="Например: Худи"></div>`,
        actions: [
          { label: 'Отмена', variant: 'btn-ghost' },
          { label: 'Создать', variant: 'btn-primary', onClick: () => {
            try {
              Categories.save($('#cat-name').value);
              toast('Категория создана'); render(); return true;
            } catch(e) { toast(e.message, 'error'); return false; }
          }}
        ]
      });
    };

    content.onclick = async e => {
      const ren = e.target.closest('[data-ren]');
      if (ren) {
        const c = Categories.find(ren.dataset.ren);
        openModal({
          title: 'Переименовать категорию',
          body: `<div class="field"><label>Название</label><input class="input" id="cat-rename" value="${esc(c.name)}"></div>`,
          actions: [
            { label:'Отмена', variant:'btn-ghost' },
            { label:'Сохранить', variant:'btn-primary', onClick: () => {
              const v = $('#cat-rename').value.trim();
              if (!v) { toast('Укажите название', 'error'); return false; }
              const list = Categories.all().map(x => x.id === c.id ? { ...x, name: v } : x);
              setCategories(list); toast('Изменено'); render(); return true;
            }}
          ]
        });
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        const c = Categories.find(del.dataset.del);
        const ok = await confirmDialog('Удалить категорию?', `«${c.name}» будет удалена. Товары останутся без категории.`);
        if (ok) { Categories.remove(c.id); toast('Категория удалена'); render(); }
      }
    };
  }
  render();
}

/* ---------- router ---------- */
function parseHash() {
  const h = (location.hash || '#/').slice(1) || '/';
  const [path, qs=''] = h.split('?');
  return { path: path || '/', params: new URLSearchParams(qs) };
}
function navigate() {
  const { path, params } = parseHash();
  renderHeader();
  const app = $('#app');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  if (path === '/' || path === '') return pageHome(app);
  if (path === '/about') return pageAbout(app);
  if (path === '/catalog') return pageCatalog(app, params);
  if (path.startsWith('/product/')) return pageProduct(app, path.slice(9));
  if (path === '/cart') return pageCart(app);
  if (path === '/checkout') return pageCheckout(app);
  if (path === '/favorites') return pageFavorites(app);
  if (path === '/account') return pageAccount(app);
  if (path === '/login') return pageLogin(app);
  if (path === '/register') return pageRegister(app);
  if (path.startsWith('/admin')) return pageAdmin(app, path.slice(6));
  return page404(app);
}

window.addEventListener('hashchange', navigate);
window.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  navigate();
});
</script>
