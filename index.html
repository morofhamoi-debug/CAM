<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HTML Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1e2e;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top {
    padding: 15px;
    display: flex;
    gap: 10px;
    background: #181825;
    border-bottom: 1px solid #313244;
  }

  textarea {
    flex: 1;
    padding: 20px;
    font-family: monospace;
    font-size: 14px;
    background: #1e1e2e;
    color: #cdd6f4;
    border: none;
    outline: none;
    resize: none;
  }

  button {
    padding: 12px 24px;
    background: #89b4fa;
    color: #1e1e2e;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover { background: #b4befe; }

  /* Полноэкранный просмотр */
  #full {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    z-index: 999;
  }

  #full iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Маленькая кнопка выхода */
  #exit {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 6px 14px;
    font-size: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    z-index: 1000;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  #exit:hover { opacity: 1; }
</style>
</head>
<body>

  <div class="top">
    <button onclick="show()">▶ Показать</button>
  </div>

  <textarea id="code" placeholder="Вставь свой HTML код сюда..."><h1 style="color:#764ba2;font-family:sans-serif;text-align:center;margin-top:100px">Привет, мир!</h1>
<p style="text-align:center;font-family:sans-serif">Замени этот код своим 👆</p></textarea>

  <div id="full">
    <iframe id="preview"></iframe>
    <button id="exit" onclick="hide()">✕ Выйти</button>
  </div>

<script>
  // Сохраняем код в браузере, чтобы не потерялся
  const code = document.getElementById('code');
  code.value = localStorage.getItem('mycode') || code.value;

  code.addEventListener('input', () => {
    localStorage.setItem('mycode', code.value);
  });

  function show() {
    document.getElementById('preview').srcdoc = code.value;
    document.getElementById('full').style.display = 'block';
  }

  function hide() {
    document.getElementById('full').style.display = 'none';
  }

  // Esc тоже закрывает
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hide();
  });
</script>

</body>
</html>
